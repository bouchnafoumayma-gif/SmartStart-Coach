# Docker Compose - PostgreSQL + Redis + API
# aegra dev  -> docker compose up postgres -d  (database only, in-memory broker)
# aegra up   -> docker compose up --build      (full stack, Redis broker)

services:
  postgres:
    image: pgvector/pgvector:pg18
    container_name: hackapertustemplate26-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hackapertustemplate26}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hackapertustemplate26_secret}
      POSTGRES_DB: ${POSTGRES_DB:-hackapertustemplate26}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hackapertustemplate26}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: hackapertustemplate26-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  hackapertustemplate26:
    build: .
    container_name: hackapertustemplate26-api
    restart: unless-stopped
    ports:
      - "${PORT:-2026}:${PORT:-2026}"
    env_file:
      - path: .env
        required: false   # sur une copie propre (juges), les LLM_* viennent du shell
    environment:
      - LLM_NAME=${LLM_NAME:-}
      - LLM_BASE_URL=${LLM_BASE_URL:-}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - DATA_DIR=/app/data
      - POSTGRES_USER=${POSTGRES_USER:-hackapertustemplate26}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-hackapertustemplate26_secret}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-hackapertustemplate26}
      - AEGRA_CONFIG=aegra.json
      - AUTH_TYPE=${AUTH_TYPE:-noop}
      - PORT=${PORT:-2026}
      - REDIS_BROKER_ENABLED=true
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:${PORT:-2026}/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    volumes:
      - ./src:/app/src:ro
      - ./aegra.json:/app/aegra.json:ro
      - ../data:/app/data:ro

  # Site de l'élève : formulaire -> entretien -> feedback, sur http://localhost:8090
  web:
    build: .
    container_name: hackapertustemplate26-web
    restart: unless-stopped
    command: ["python", "form_server.py"]
    ports:
      - "${FORM_PORT:-8090}:8090"
    environment:
      - FORM_HOST=0.0.0.0
      - FORM_PORT=8090
      - AGENT_URL=http://hackapertustemplate26:${PORT:-2026}
    depends_on:
      hackapertustemplate26:
        condition: service_started
    volumes:
      - ./form_server.py:/app/form_server.py:ro
      - ./form:/app/form:ro
      - ./src:/app/src:ro

volumes:
  postgres_data:
  redis_data: