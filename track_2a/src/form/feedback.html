<!doctype html>
<html lang="fr">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="theme-color" content="#ffffff">
	<title>Ton feedback | SmartStart Coach</title>
	<style>
		:root {
			color-scheme: light;
			--ink: #1c263b;
			--muted: #637087;
			--line: #dce2e9;
			--red: #e32920;
			--red-dark: #c91f19;
			--red-wash: #fff0ee;
			--green: #176e58;
			--green-wash: #eaf6ef;
			font-family: "Avenir Next", Avenir, "Segoe UI", sans-serif;
			color: var(--ink);
			background: #fff;
		}
		* { box-sizing: border-box; }
		[hidden] { display: none !important; }
		body { min-width: 320px; margin: 0; background: #fff; }
		a { color: inherit; }
		.shell { width: min(1040px, calc(100% - 48px)); margin: 0 auto; }
		header {
			height: 76px;
			display: flex;
			align-items: center;
			justify-content: space-between;
			border-bottom: 1px solid #edf0f4;
		}
		.brand { display: flex; align-items: center; gap: 11px; font-weight: 750; }
		.brand-mark {
			display: grid;
			place-items: center;
			width: 38px;
			height: 38px;
			color: #fff;
			background: var(--red);
			border-radius: 11px;
			font-size: 27px;
			line-height: 1;
		}
		.brand-sub { color: var(--muted); font-weight: 500; }
		.back-link { color: #536078; font-size: 14px; text-decoration: none; }
		.back-link:hover { color: var(--red-dark); }
		main { width: min(860px, 100%); margin: 0 auto; padding: 48px 0 80px; }
		.sample-label {
			display: inline-flex;
			align-items: center;
			gap: 8px;
			margin-bottom: 21px;
			padding: 8px 11px;
			color: #7a4b13;
			background: #fff7e5;
			border: 1px solid #f1dfb5;
			border-radius: 999px;
			font-size: 12px;
			font-weight: 700;
		}
		.sample-label[hidden] { display: none; }
		.sample-dot { width: 7px; height: 7px; border-radius: 50%; background: #d38a20; }
		.eyebrow { margin-bottom: 10px; color: var(--red); font-size: 12px; font-weight: 800; text-transform: uppercase; }
		h1, h2, h3, p { margin-top: 0; }
		h1 { margin-bottom: 12px; font-size: 34px; font-weight: 760; line-height: 1.2; }
		.summary { max-width: 690px; margin-bottom: 28px; color: #526078; font-size: 16px; line-height: 1.7; }
		.session-meta { display: flex; align-items: center; gap: 10px; margin-bottom: 36px; color: var(--muted); font-size: 12px; }
		.meta-mark { width: 7px; height: 7px; border-radius: 50%; background: var(--green); }
		.feedback-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 28px; }
		.feedback-grid[hidden] { display: none; }
		.feedback-section { min-width: 0; }
		.section-heading { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
		.section-icon {
			display: grid;
			place-items: center;
			flex: 0 0 32px;
			width: 32px;
			height: 32px;
			color: var(--green);
			background: var(--green-wash);
			border-radius: 50%;
			font-size: 16px;
			font-weight: 800;
		}
		.feedback-section.development .section-icon { color: var(--red-dark); background: var(--red-wash); }
		h2 { margin: 0; font-size: 17px; font-weight: 750; }
		.section-count { margin-left: auto; color: var(--muted); font-size: 12px; }
		.criterion-list { display: grid; gap: 12px; }
		.criterion-card {
			min-width: 0;
			padding: 17px 17px 16px;
			background: #fff;
			border: 1px solid var(--line);
			border-radius: 8px;
			box-shadow: 0 2px 4px rgba(24, 37, 59, .045);
		}
		.criterion-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
		.criterion-name { margin-bottom: 8px; font-size: 14px; font-weight: 750; line-height: 1.4; }
		.rating { display: flex; align-items: center; gap: 2px; flex: 0 0 auto; padding-top: 1px; }
		.rating-dot { width: 7px; height: 7px; border-radius: 50%; background: #e5e8ed; }
		.rating-dot.filled { background: var(--green); }
		.development .rating-dot.filled { background: var(--red); }
		.rating-text { margin-left: 5px; color: var(--muted); font-size: 11px; white-space: nowrap; }
		.quote-label { display: block; margin: 2px 0 5px; color: #7b8799; font-size: 10px; font-weight: 800; text-transform: uppercase; }
		blockquote { margin: 0 0 10px; padding-left: 11px; color: #34415a; border-left: 2px solid #cbd4e0; font-size: 13px; font-style: italic; line-height: 1.55; overflow-wrap: anywhere; }
		.rationale { margin-bottom: 0; color: #59667b; font-size: 13px; line-height: 1.55; }
		.tip { margin: 12px 0 0; padding: 11px 12px; color: #7d2b25; background: var(--red-wash); border-radius: 6px; font-size: 12px; line-height: 1.55; }
		.tip-label { display: block; margin-bottom: 3px; color: var(--red-dark); font-size: 10px; font-weight: 800; text-transform: uppercase; }
		.empty-section { padding: 15px; color: var(--muted); background: #f7f8fa; border-radius: 7px; font-size: 13px; line-height: 1.55; }
		.support-note { display: flex; gap: 12px; margin-top: 28px; padding: 17px 18px; color: #34415a; background: #f2f6fb; border: 1px solid #dce5ef; border-radius: 8px; }
		.support-icon { color: var(--red); font-size: 18px; }
		.support-note p { margin: 0; font-size: 13px; line-height: 1.6; }
		.closing { margin-top: 32px; padding-top: 21px; color: #526078; border-top: 1px solid #edf0f4; font-size: 14px; line-height: 1.65; }
		.raw-fallback { margin-top: 24px; padding: 18px; color: #34415a; background: #f7f8fa; border-radius: 8px; white-space: pre-wrap; overflow-wrap: anywhere; font-size: 13px; line-height: 1.65; }
		.raw-fallback[hidden] { display: none; }
		.actions { display: flex; gap: 10px; margin-top: 24px; }
		.button { min-height: 42px; padding: 0 15px; color: var(--ink); background: #fff; border: 1px solid var(--line); border-radius: 5px; font: inherit; font-size: 12px; font-weight: 700; cursor: pointer; }
		.button:hover { border-color: #aeb8c7; }
		.button[hidden] { display: none; }
		.status { min-height: 20px; margin-top: 8px; color: var(--muted); font-size: 12px; }
		@media (max-width: 700px) {
			.shell { width: min(100% - 32px, 560px); }
			header { height: 64px; }
			.brand { gap: 8px; font-size: 14px; }
			.brand-mark { width: 33px; height: 33px; }
			.back-link { font-size: 12px; }
			main { padding: 34px 0 56px; }
			h1 { font-size: 29px; }
			.summary { font-size: 14px; }
			.session-meta { margin-bottom: 27px; }
			.feedback-grid { grid-template-columns: 1fr; gap: 26px; }
			.criterion-card { padding: 15px; }
			.actions { flex-wrap: wrap; }
		}
		@media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; transition-duration: .01ms !important; } }
	</style>
</head>
<body>
	<div class="shell">
		<header>
			<div class="brand"><span class="brand-mark" aria-hidden="true">+</span><span>SmartStart <span class="brand-sub">Coach</span></span></div>
			<a class="back-link" href="/">← Retour à la pratique</a>
		</header>
		<main>
			<div class="sample-label" id="sample-label"><span class="sample-dot" aria-hidden="true"></span>Aperçu avec exemple de données</div>
			<section aria-labelledby="feedback-title">
				<div class="eyebrow" id="eyebrow">Ton entretien est terminé</div>
				<h1 id="feedback-title">Ton feedback</h1>
				<p class="summary" id="summary"></p>
				<div class="session-meta"><span class="meta-mark" aria-hidden="true"></span><span id="meta-text">Un retour basé sur tes réponses pendant l’entretien</span></div>
			</section>
			<div class="feedback-grid" id="feedback-grid">
				<section class="feedback-section strengths" aria-labelledby="strengths-title">
					<div class="section-heading"><span class="section-icon" aria-hidden="true">✓</span><h2 id="strengths-title">Tes points forts</h2><span class="section-count" id="strength-count"></span></div>
					<div class="criterion-list" id="strength-list"></div>
				</section>
				<section class="feedback-section development" aria-labelledby="development-title">
					<div class="section-heading"><span class="section-icon" aria-hidden="true">↗</span><h2 id="development-title">À travailler ensuite</h2><span class="section-count" id="development-count"></span></div>
					<div class="criterion-list" id="development-list"></div>
				</section>
			</div>
			<aside class="support-note" id="support-note" hidden>
				<span class="support-icon" aria-hidden="true">＋</span>
				<p id="support-text"></p>
			</aside>
			<p class="closing" id="closing" hidden></p>
			<pre class="raw-fallback" id="raw-fallback" hidden></pre>
			<div class="actions">
				<button class="button" id="copy-feedback" type="button">Copier le feedback</button>
				<button class="button" id="print-feedback" type="button">Imprimer</button>
			</div>
			<div class="status" id="status" role="status" aria-live="polite"></div>
		</main>
	</div>
	<script>
		const CRITERION_LABELS = {
			de: { clarity: "Klarheit", relevance: "Relevanz", motivation: "Motivation", self_reflection: "Selbstreflexion", communication: "Kommunikation", concrete_examples: "Konkrete Beispiele", demeanor: "Auftreten & Wirkung", preparation: "Vorbereitung / Betriebskenntnis", goal_orientation: "Zielorientierung", difficult_questions: "Umgang mit schwierigen Fragen", initiative: "Eigeninitiative" },
			fr: { clarity: "Clarté", relevance: "Pertinence", motivation: "Motivation", self_reflection: "Réflexion sur soi", communication: "Communication", concrete_examples: "Exemples concrets", demeanor: "Attitude et impression", preparation: "Préparation / connaissance de l’entreprise", goal_orientation: "Orientation vers les objectifs", difficult_questions: "Gestion des questions difficiles", initiative: "Initiative" },
			it: { clarity: "Chiarezza", relevance: "Pertinenza", motivation: "Motivazione", self_reflection: "Autoriflessione", communication: "Comunicazione", concrete_examples: "Esempi concreti", demeanor: "Presenza e impressione", preparation: "Preparazione / conoscenza dell’azienda", goal_orientation: "Orientamento agli obiettivi", difficult_questions: "Gestione delle domande difficili", initiative: "Iniziativa" },
		};
		const SCALE = {
			de: ["", "Ungenügend", "Ausbaufähig", "Gut", "Sehr gut"],
			fr: ["", "Insuffisant", "À développer", "Bien", "Très bien"],
			it: ["", "Insufficiente", "Da sviluppare", "Buono", "Molto buono"],
		};
		const SUPPORT_TEXT = {
			de: "Wenn dich etwas belastet, sprich bitte mit einer Person, der du vertraust, zum Beispiel mit deinen Eltern, einer Lehrperson oder der Berufsberatung.",
			fr: "Si quelque chose te pèse, parles-en à une personne de confiance, par exemple tes parents, un enseignant ou un conseiller en orientation.",
			it: "Se qualcosa ti pesa, parlane con una persona di fiducia, per esempio i tuoi genitori, un insegnante o un consulente di orientamento.",
		};
		const SAMPLE = {
			texte: "Ton feedback\nTu as expliqué ton intérêt avec un exemple précis. Pour progresser, ajoute une situation concrète quand tu parles de tes qualités.",
			donnees: {
				niveaux: { motivation: 4, concrete_examples: 2 },
				criteres: [
					{ criterion: "motivation", level: 4, evidence: "Pendant le stage, j’ai aimé comprendre comment les pièces s’assemblent.", rationale: "Tu relies ton intérêt pour le métier à une expérience précise.", tip: "" },
					{ criterion: "concrete_examples", level: 2, evidence: "Je suis quelqu’un de très organisé.", rationale: "Tu nommes une qualité, mais tu ne donnes pas encore de situation pour l’illustrer.", tip: "Raconte une situation réelle où ton organisation t’a aidé." },
				],
				resume: "Tu as expliqué ton intérêt pour le métier avec un exemple précis. Tu peux maintenant illustrer tes qualités avec une situation vécue.",
				cloture: "C’était un entraînement : chaque entretien t’aide à progresser.",
			},
			appels: 2,
			avec_soutien: false,
		};

		function text(element, value) {
			element.textContent = value || "";
		}

		function renderCriterion(item, language, development) {
			const card = document.createElement("article");
			card.className = "criterion-card";
			const top = document.createElement("div");
			top.className = "criterion-top";
			const name = document.createElement("h3");
			name.className = "criterion-name";
			text(name, CRITERION_LABELS[language]?.[item.criterion] || item.criterion || "Critère");
			const rating = document.createElement("div");
			rating.className = "rating";
			rating.setAttribute("aria-label", `${SCALE[language][item.level] || ""} ${item.level || ""} sur 4`);
			for (let index = 1; index <= 4; index += 1) {
				const dot = document.createElement("span");
				dot.className = `rating-dot${index <= item.level ? " filled" : ""}`;
				rating.append(dot);
			}
			const ratingText = document.createElement("span");
			ratingText.className = "rating-text";
			text(ratingText, `${SCALE[language][item.level] || ""} ${item.level || ""}/4`);
			rating.append(ratingText);
			top.append(name, rating);
			card.append(top);
			if (item.evidence) {
				const quoteLabel = document.createElement("span");
				quoteLabel.className = "quote-label";
				text(quoteLabel, language === "de" ? "Exakter Auszug" : language === "it" ? "Citazione esatta" : "Extrait exact de ta réponse");
				const quote = document.createElement("blockquote");
				text(quote, `« ${item.evidence} »`);
				card.append(quoteLabel, quote);
			}
			if (item.rationale) {
				const rationale = document.createElement("p");
				rationale.className = "rationale";
				text(rationale, item.rationale);
				card.append(rationale);
			}
			if (development && item.tip) {
				const tip = document.createElement("p");
				tip.className = "tip";
				const label = document.createElement("span");
				label.className = "tip-label";
				text(label, language === "de" ? "Tipp" : language === "it" ? "Consiglio" : "Conseil");
				tip.append(label, document.createTextNode(item.tip));
				card.append(tip);
			}
			return card;
		}

		function renderFeedback(result, languageOverride) {
			const data = result?.donnees || {};
			const requestedLanguage = languageOverride || result?.langue || result?.language || sessionStorage.getItem("smartstart.language");
			const language = ["de", "fr", "it"].includes(requestedLanguage) ? requestedLanguage : "fr";
			const criteria = (Array.isArray(data.criteres) ? data.criteres : [])
				.map((item) => ({ ...item, level: Number(item.level ?? data.niveaux?.[item.criterion]) }))
				.filter((item) => Number.isInteger(item.level) && item.level >= 1 && item.level <= 4);
			const strengths = criteria.filter((item) => Number(item.level) >= 3).slice(0, 2);
			const development = criteria.filter((item) => Number(item.level) <= 2).slice(0, 2);
			const hasStructuredFeedback = strengths.length + development.length > 0;

			document.documentElement.lang = language;
			text(document.querySelector("#summary"), data.resume || "");
			text(document.querySelector("#closing"), data.cloture || "");
			document.querySelector("#closing").hidden = !data.cloture;
			text(document.querySelector("#strength-count"), strengths.length ? `${strengths.length}` : "");
			text(document.querySelector("#development-count"), development.length ? `${development.length}` : "");

			const strengthList = document.querySelector("#strength-list");
			const developmentList = document.querySelector("#development-list");
			strengthList.replaceChildren();
			developmentList.replaceChildren();
			strengths.forEach((item) => strengthList.append(renderCriterion(item, language, false)));
			development.forEach((item) => developmentList.append(renderCriterion(item, language, true)));
			if (!strengths.length) {
				const empty = document.createElement("p");
				empty.className = "empty-section";
				text(empty, language === "fr" ? "Aucun point fort n’a pu être évalué avec les réponses disponibles." : "No strengths could be assessed from the available answers.");
				strengthList.append(empty);
			}
			if (!development.length) {
				const empty = document.createElement("p");
				empty.className = "empty-section";
				text(empty, language === "fr" ? "Aucun axe de progrès précis n’a été retenu." : "No specific development point was selected.");
				developmentList.append(empty);
			}

			const rawFallback = document.querySelector("#raw-fallback");
			rawFallback.hidden = hasStructuredFeedback || !result?.texte;
			text(rawFallback, result?.texte || "");
			document.querySelector("#feedback-grid").hidden = !hasStructuredFeedback;
			const supportNote = document.querySelector("#support-note");
			supportNote.hidden = !result?.avec_soutien;
			text(document.querySelector("#support-text"), SUPPORT_TEXT[language] || SUPPORT_TEXT.fr);
			document.querySelector("#sample-label").hidden = Boolean(result?._sample !== true);
			document.querySelector("#meta-text").textContent = result?._sample
				? "Exemple de présentation, pas un bilan issu d’un entretien réel"
				: "Un retour basé sur tes réponses pendant l’entretien";
			window.currentFeedbackText = result?.texte || [data.resume, data.cloture].filter(Boolean).join("\n\n");
		}

		const sampleFeedback = { ...SAMPLE, _sample: true };
		let incomingFeedback = null;
		try {
			incomingFeedback = JSON.parse(sessionStorage.getItem("smartstart.feedback") || "null");
		} catch {
			incomingFeedback = null;
		}
		renderFeedback(incomingFeedback || sampleFeedback);

		document.querySelector("#copy-feedback").addEventListener("click", async () => {
			const status = document.querySelector("#status");
			try {
				await navigator.clipboard.writeText(window.currentFeedbackText || "");
				text(status, "Feedback copié.");
			} catch {
				text(status, "La copie n’est pas disponible dans ce navigateur.");
			}
		});
		document.querySelector("#print-feedback").addEventListener("click", () => window.print());
		window.renderFeedback = renderFeedback;
	</script>
</body>
</html>
